  <header>

  <main>

    <h1>We are launching <span class="boldWord">soon!</span></h1>

    <p class="subscribePrompt">
      Subscribe and get notified
    </p>

    <form action="" id="subscribeForm" novalidate>

      <div class="userEmailContainer">
        <input class="emailInput " type="email" name="" id="" placeholder="Your email address..." required>
        <p class="warningTxt hidden">
          Please provide a valid email address
        </p>
      </div>
      <input type="submit" value="Notify Me" class="submitInput" autocomplete="email" aria-describedby="emailError">
    </form>

    <img src="./assets/images/illustration-dashboard.png" alt="" class="mainImg">
